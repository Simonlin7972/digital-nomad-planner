<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天不在家工作 — Hype Reel 16:9</title>
<!-- Same faces as the app: 975HazyGo (400/600) for everything, Pixelify Sans only for the English tagline. -->
<link rel="stylesheet" href="https://font.emtech.cc/css/975HazyGo/400" />
<link rel="stylesheet" href="https://font.emtech.cc/css/975HazyGo/600" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400&display=block" />
<link rel="stylesheet" href="../../node_modules/flag-icons/css/flag-icons.min.css" />
<script src="icons.js"></script>
<style>
/* A 60-second, 1920×1080 reel. Every animation is a CSS animation whose delay is an absolute time on the reel
   (--t, in seconds), and every scene is only visible between --s and --s + --d. So the whole reel is a function of
   one clock: it plays live in a browser, and render.mjs seeks it frame by frame to make the MP4. Cuts sit on a
   120 BPM grid (every 0.5 s) so a music track can be laid under it. */

@property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }

:root {
  --bg: #faf9f6; --dot: #d3cfc6; --surface: #fff; --subtle: #f7f7f7; --text: #222; --muted: #6a6a6a;
  --line: #ebebeb; --line-strong: #ddd; --accent: #ff385c; --danger: #c13515;
  --red: #cf4b45; --orange: #d97a1e; --yellow: #a8841f; --green: #4a9d5b; --teal: #2a9d8f; --blue: #3b82c4;
  --purple: #7c5cc4; --pink: #c2548f;
  --pop: cubic-bezier(.2, 1.5, .4, 1);
  --snap: cubic-bezier(.7, 0, .2, 1);
  font-family: '975HazyGo', -apple-system, 'PingFang TC', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
body { display: grid; place-items: center; }

#stage {
  position: relative; width: 1920px; height: 1080px; overflow: hidden; flex: none;
  background: var(--bg);
  transform-origin: center;
}
.render #stage { transform: none !important; }
body.render { display: block; }

/* ---------- scenes ---------- */
.scene {
  position: absolute; inset: 0; visibility: hidden; overflow: hidden;
  animation: show calc(var(--d) * 1s) step-end calc(var(--s) * 1s);
}
@keyframes show { from, to { visibility: visible; } }
.paper { background: var(--bg); }
.paper::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(circle, var(--dot) 2px, transparent 2.8px);
  background-size: 40px 40px; background-position: 20px 20px;
}
.ink { background: var(--text); color: #fff; }
.hot { background: var(--accent); color: #fff; }
/* Every scene drifts in slowly, so even the holds feel alive */
.cam { position: absolute; inset: 0; animation: drift calc(var(--d) * 1s) linear calc(var(--s) * 1s) both; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.045); } }

/* ---------- one-shot animations, started at --t ---------- */
.a { animation-delay: calc(var(--t, 0) * 1s); animation-fill-mode: both; }
.slam { animation-name: slam; animation-duration: .36s; animation-timing-function: var(--pop); }
@keyframes slam { from { transform: scale(2.2); opacity: 0; filter: blur(14px); } 40% { opacity: 1; } to { transform: none; opacity: 1; filter: none; } }
.pop { animation-name: pop; animation-duration: .4s; animation-timing-function: var(--pop); }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
.up { animation-name: up; animation-duration: .45s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
@keyframes up { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
.wipe { animation-name: wipe; animation-duration: .4s; animation-timing-function: var(--snap); }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.drop { animation-name: drop; animation-duration: .5s; animation-timing-function: var(--pop); }
@keyframes drop { from { transform: translateY(-160px) rotate(-8deg); opacity: 0; } to { opacity: 1; } }
.shake { animation-name: shake; animation-duration: .4s; animation-fill-mode: none; }
@keyframes shake { 20% { transform: translate(-14px, 4px) rotate(-1deg); } 40% { transform: translate(12px, -6px) rotate(1deg); } 60% { transform: translate(-8px, 2px); } 80% { transform: translate(6px, -2px); } }
.punch { animation-name: punch; animation-duration: .3s; animation-fill-mode: none; }
@keyframes punch { 40% { transform: scale(1.08); } }
.flash { position: absolute; inset: 0; background: #fff; pointer-events: none; z-index: 50; opacity: 0;
  animation: flash .22s ease-out calc(var(--t) * 1s) forwards; }
@keyframes flash { from { opacity: .9; } to { opacity: 0; } }

/* ---------- type ---------- */
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.big { font-weight: 600; line-height: 1.08; letter-spacing: .01em; }
.hl { color: var(--accent); }
.mute { color: var(--muted); font-weight: 400; }
.wordline { display: flex; gap: 0 .35em; white-space: nowrap; }
.wordline > span { display: inline-block; flex: none; }

/* ---------- the app's pieces, drawn big ---------- */
.window { position: absolute; background: var(--surface); border: 2px solid var(--line-strong); border-radius: 28px;
  box-shadow: 0 20px 60px rgb(0 0 0 / .12); overflow: hidden; }
.chrome { display: flex; gap: 12px; padding: 22px 28px; border-bottom: 2px solid var(--line); }
.chrome i { width: 18px; height: 18px; border-radius: 50%; background: var(--line-strong); }
.track { position: absolute; border-radius: 16px; background-color: var(--subtle);
  background-image: linear-gradient(to right, var(--line) 2px, transparent 2px); background-size: var(--cell) 100%; }
.block { position: absolute; top: 8px; bottom: 8px; display: flex; align-items: center; padding: 0 22px; border-radius: 12px;
  color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; }
.block small { font-weight: 400; opacity: .85; margin-left: .5em; font-size: .7em; }
.select { position: absolute; top: 8px; bottom: 8px; border: 5px dashed var(--text); border-radius: 12px; background: rgb(34 34 34 / .06); }
.cursor { position: absolute; width: 84px; height: 84px; z-index: 5; margin: -10px 0 0 -14px;
  filter: drop-shadow(0 0 3px #fff) drop-shadow(0 4px 8px rgb(0 0 0 / .3)); }
.icon { display: block; width: 100%; height: 100%; fill: currentColor; }
.kbd { display: inline-grid; place-items: center; background: #fff; color: var(--text); border: 4px solid var(--line-strong);
  border-bottom-width: 22px; border-radius: 36px; font-weight: 600; }
.flagchip { display: inline-flex; align-items: center; gap: 12px; }
.fi { border-radius: 4px; box-shadow: 0 0 0 1px rgb(0 0 0 / .08); }
.pill { display: inline-flex; align-items: center; gap: 14px; border-radius: 999px; font-weight: 600; }

/* Mascot: two frames swapped with a hard cut, as in the app header */
.nomad .fb { animation: nf 1.1s steps(1, end) -.55s infinite; }
.nomad .fa { animation: nf 1.1s steps(1, end) infinite; }
@keyframes nf { 0% { opacity: 1; } 50% { opacity: 0; } }

/* Pixel sparkles from the app's storyboard */
.spark { position: absolute; width: 36px; height: 36px; animation: twinkle 1s steps(2, jump-none) infinite; }
.spark::before, .spark::after { content: ''; position: absolute; background: var(--c, var(--accent)); }
.spark::before { left: 12px; top: 0; width: 12px; height: 36px; }
.spark::after { top: 12px; left: 0; width: 36px; height: 12px; }
@keyframes twinkle { 50% { transform: scale(.6); } }

/* counters: an animated integer shown through a CSS counter */
.count { counter-reset: n var(--n); }
.count::after { content: counter(n); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal .wd { text-align: center; font-size: 30px; color: var(--muted); padding: 10px 0 16px; }
.cal .day { position: relative; height: 128px; border-top: 2px solid var(--line); padding: 10px 14px; font-size: 30px; }
.cal .day.hol { background: #fdeceb; }
.cal .day.hol b { position: absolute; right: 12px; top: 12px; font-size: 22px; color: var(--danger); font-weight: 400; }
.calbar { position: absolute; height: 52px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 28px;
  display: flex; align-items: center; padding: 0 16px; white-space: nowrap; overflow: hidden; }

/* season strip */
.season { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; }
.season div { height: 170px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; font-size: 34px; font-weight: 600; }
.season .r2 { background: #dcefe0; color: #2f6b3c; }
.season .r1 { background: var(--subtle); color: var(--muted); border: 2px solid var(--line); }
.season .r0 { background: #f6dedc; color: var(--danger); }
.season small { font-size: 24px; font-weight: 400; }
.alarm { animation: alarm .5s steps(1, end) infinite; }
@keyframes alarm { 50% { background: var(--danger); color: #fff; } }

/* meters */
.meter { position: absolute; height: 40px; border-radius: 999px; background: rgb(255 255 255 / .12); overflow: hidden; }
.paper .meter { background: #ece9e2; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
</style>
</head>
<body>
<div id="stage"></div>

<script>
// ---------- tiny builders ----------
const stage = document.getElementById('stage');
let sheet = '';
const css = (s) => (sheet += s + '\n');
let kfId = 0;
// Registers a one-off keyframes rule and returns its name.
function kf(frames) {
  const name = 'k' + kfId++;
  css(`@keyframes ${name} { ${frames} }`);
  return name;
}
// An element that runs keyframes `name` for `dur` seconds starting at reel time `t`.
const anim = (name, t, dur, ease = 'cubic-bezier(.7,0,.2,1)') =>
  `animation: ${name} ${dur}s ${ease} ${t}s both;`;
const icon = (n, w = 'fill') =>
  `<svg class="icon" viewBox="0 0 256 256"><path d="${ICONS[n + '_' + w]}"/></svg>`;
const flag = (cc, w = 64) => `<span class="fi fi-${cc}" style="width:${w}px;height:${Math.round(w * .75)}px;background-size:cover"></span>`;
function scene(s, d, cls, html) {
  stage.insertAdjacentHTML('beforeend', `<section class="scene ${cls}" style="--s:${s};--d:${d}"><div class="cam">${html}</div></section>`);
}
const flash = (t) => stage.insertAdjacentHTML('beforeend', `<div class="flash" style="--t:${t}"></div>`);
const A = (cls, t, html, style = '', tag = 'div') => `<${tag} class="a ${cls}" style="--t:${t};${style}">${html}</${tag}>`;

// The mascot, from the app's PixelNomad frames
const PAL = { K: '#222222', S: '#f2c9a0', H: '#5a3b2a', C: '#ff5a5f', D: '#444444', B: '#7fc4e8', W: '#ffffff', T: '#8a5a3a', L: '#3f9b62', Y: '#f5b83d', A: '#ead9b0' };
const FA = ['.YY.......LL....', '.YY.....LLLLLL..', '.......LL.TL.LL.', '......L...T...L.', '..........T.....', '...HHH....T.....', '..HHHH....T.....', '..HSSK...T......', '..SSSS...T......', '..CCC....T......', '.CCCCS.D.T......', '.CCCCSSDB.T.....', '.CCKKKKDDDT.....', 'AAAAAAAAAAAAAAAA', 'AAAAAAAAAAAAAAAA'];
const FB = ['.YY......LL.....', '.YY....LLLLLL...', '......LL..TLLL..', '.....L....T..L..', ...FA.slice(4, 10), '.CCCCSSD.T......', '.CCCCS.DW.T.....', ...FA.slice(12)];
const rects = (f) => f.map((row, y) => [...row].map((ch, x) => (PAL[ch] ? `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[ch]}"/>` : '')).join('')).join('');
const nomad = (w) => `<svg class="nomad" viewBox="0 0 16 15" width="${w}" height="${w * 15 / 16}" shape-rendering="crispEdges"><g class="fa">${rects(FA)}</g><g class="fb">${rects(FB)}</g></svg>`;

const C = { red: '#cf4b45', orange: '#d97a1e', teal: '#2a9d8f', blue: '#3b82c4', purple: '#7c5cc4', green: '#4a9d5b', pink: '#c2548f', yellow: '#a8841f' };
// The landing page's sample year, in weeks
const PLAN = [
  ['tw', '台北', 0, 7, C.red], ['th', '清邁', 8, 13, C.orange], ['id', '倉古', 14, 20, C.teal], ['pt', '里斯本', 21, 28, C.blue],
  ['ge', '提比里斯', 29, 33, C.purple], ['mx', '墨西哥城', 36, 44, C.green], ['tw', '台北', 47, 52, C.red],
];
const COUNTRY = { tw: '台灣', th: '泰國', id: '印尼', pt: '葡萄牙', ge: '喬治亞', mx: '墨西哥' };

// ============ 0.0  Hook ============
scene(0, 2.5, 'paper', `
  <div class="center big" style="font-size:190px;gap:10px">
    ${A('slam', 0.05, '你決定')}
    ${A('slam', 0.55, '開始<span class="hl">數位遊牧</span>了')}
  </div>
  <div class="a pop" style="--t:1.3;position:absolute;right:180px;top:110px">${nomad(220)}</div>
  <div class="spark" style="left:220px;top:180px;--c:${C.orange}"></div>
  <div class="spark" style="left:300px;bottom:170px;--c:${C.teal}"></div>
`);

// ============ 2.5  "Then what?" ============
flash(2.5);
scene(2.5, 2, 'ink', `
  <div class="center">
    <div class="a shake" style="--t:3.2">${A('slam big', 2.5, '然後呢？', 'font-size:320px')}</div>
    ${A('up mute', 3.4, '明年，要住哪？', 'font-size:72px;margin-top:30px;color:#aaa')}
  </div>
`);

// ============ 4.5  365 days, so many places ============
{
  const flags = ['jp', 'th', 'pt', 'mx', 'id', 'ge', 'kr', 'vn', 'es', 'it', 'gr', 'tr', 'co', 'ar', 'au', 'nz', 'my', 'ph', 'hr', 'de', 'fr', 'gb', 'us', 'ca', 'br', 'pe', 'ma', 'za', 'ae', 'in', 'lk', 'np', 'sg', 'hu', 'cz', 'ee'];
  const grid = flags.map((cc, i) => {
    const r = ((i * 37) % 13) - 6;
    return `<div class="a pop" style="--t:${(4.7 + i * 0.028).toFixed(3)};transform:rotate(${r}deg)">${flag(cc, 150)}</div>`;
  }).join('');
  const n365 = kf('from { --n: 0 } to { --n: 365 }');
  scene(4.5, 3, 'paper', `
    <div style="position:absolute;top:70px;left:0;right:0;text-align:center" class="big">
      <span style="font-size:110px">明年的 </span><span class="count hl" style="font-size:190px;${anim(n365, 4.5, 0.9, 'cubic-bezier(.2,.8,.3,1)')}"></span><span style="font-size:110px"> 天</span>
    </div>
    <div style="position:absolute;left:150px;right:150px;top:370px;display:grid;grid-template-columns:repeat(9,1fr);gap:34px 30px;justify-items:center">${grid}</div>
    <div class="a wipe" style="--t:6.1;position:absolute;left:0;right:0;top:500px;height:250px;background:var(--text);display:grid;place-items:center;z-index:3">
      <div class="big" style="font-size:150px;color:#fff">要在<span class="hl">哪裡</span>工作？</div>
    </div>
  `);
}

// ============ 7.5  Title ============
flash(7.5);
scene(7.5, 3, 'paper', `
  <div class="center">
    <div class="a pop" style="--t:7.5">${nomad(300)}</div>
    ${A('slam big', 7.85, '今天不在家工作', 'font-size:180px;margin-top:20px')}
    <div style="font-family:'Pixelify Sans';font-size:72px;margin-top:24px;color:var(--muted);${anim(kf('from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}'), 8.45, 0.9, 'steps(23, end)')}">A Digital Nomad Planner</div>
  </div>
  <div class="spark a pop" style="--t:8.2;left:330px;top:250px;--c:${C.orange}"></div>
  <div class="spark a pop" style="--t:8.3;right:360px;top:330px;--c:${C.pink}"></div>
  <div class="spark a pop" style="--t:8.4;left:460px;bottom:200px;--c:${C.teal}"></div>
  <div class="spark a pop" style="--t:8.5;right:420px;bottom:230px;--c:${C.blue}"></div>
`);

// ============ 10.5  One year. One page. Done. ============
flash(10.5);
scene(10.5, 2, 'ink', `
  <div class="center"><div class="wordline big" style="font-size:210px">
    ${A('slam', 10.5, '一整年', '', 'span')}${A('slam', 11.0, '一頁', '', 'span')}${A('slam hl', 11.5, '排完。', '', 'span')}
  </div></div>
`);

// ============ 12.5  The 53-week timeline ============
{
  const W = 1640, cell = W / 53;
  const blocks = PLAN.map(([cc, city, s, e, col], i) =>
    `<div class="block a wipe" style="--t:${(12.85 + i * 0.2).toFixed(2)};left:${s * cell}px;width:${(e - s + 1) * cell - 6}px;background:${col};font-size:36px">${city}</div>`).join('');
  // Neighbouring stays in the same country share one bar
  const bars = PLAN.reduce((out, [cc, , s, e]) => {
    const last = out[out.length - 1];
    if (last && last.cc === cc && last.e + 1 === s) last.e = e; else out.push({ cc, s, e });
    return out;
  }, []).map((b, i) => `<div class="a up flagchip" style="--t:${(14.4 + i * 0.08).toFixed(2)};position:absolute;left:${b.s * cell}px;width:${(b.e - b.s + 1) * cell - 6}px;top:0;height:56px;padding:0 12px;border-radius:10px;background:#fff;border:2px solid var(--line);font-size:26px;overflow:hidden;white-space:nowrap">${flag(b.cc, 36)}${COUNTRY[b.cc]}</div>`).join('');
  const months = Array.from({ length: 12 }, (_, m) => `<span style="position:absolute;left:${(m / 12) * 100}%;font-size:26px;color:var(--muted)">${m + 1} 月</span>`).join('');
  scene(12.5, 4, 'paper', `
    ${A('slam big', 12.5, '<span class="hl">53</span> 週，一條時間軸', 'position:absolute;top:80px;left:0;right:0;text-align:center;font-size:130px')}
    <div class="window a up" style="--t:12.6;left:100px;top:340px;width:1720px;height:420px">
      <div class="chrome"><i></i><i></i><i></i></div>
      <div style="position:absolute;left:40px;top:96px;width:${W}px;height:40px">${months}</div>
      <div class="track" style="--cell:${cell}px;left:40px;top:150px;width:${W}px;height:150px">${blocks}</div>
      <div style="position:absolute;left:40px;top:322px;width:${W}px;height:60px">${bars}</div>
    </div>
    ${A('up', 15.4, '幾月在哪個城市，<span class="hl">一眼看完</span>', 'position:absolute;bottom:110px;left:0;right:0;text-align:center;font-size:72px;font-weight:600')}
  `);
}

// ============ 16.5  Drag to add ============
const TRACK = (inner, top = 470) => `<div class="track" style="--cell:100px;left:160px;top:${top}px;width:1600px;height:170px">${inner}</div>`;
{
  const sel = kf('from { width: 0 } to { width: 500px }');
  const cur = kf('from { left: 200px } to { left: 700px }');
  scene(16.5, 3, 'paper', `
    ${A('slam big', 16.5, '拖一下', 'position:absolute;top:90px;left:0;right:0;text-align:center;font-size:230px')}
    ${TRACK(`
      <div class="block" style="left:800px;width:500px;background:${C.blue};font-size:44px">里斯本</div>
      <div class="select" style="left:200px;${anim(sel, 16.9, 0.75)};opacity:1;animation-fill-mode:both"></div>
      <div class="block a pop" style="--t:17.7;left:200px;width:500px;background:${C.orange};font-size:44px;z-index:2">清邁<small>5 週</small></div>
      <div class="cursor" style="top:110px;${anim(cur, 16.9, 0.75)}">${icon('Cursor')}</div>
    `)}
    ${A('slam big hl', 18.0, '＝ 一段行程。', 'position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:130px')}
  `);
  // The selection box disappears once the stay lands
  css(`.scene .select { }`);
}

// ============ 19.5  Stretch, the neighbour moves ============
{
  const grow = kf('from { width: 500px } to { width: 800px }');
  const push = kf('from { left: 800px } to { left: 1000px }');
  const cur = kf('from { left: 700px } to { left: 1000px }');
  scene(19.5, 2.5, 'paper', `
    ${A('slam big', 19.5, '拉長', 'position:absolute;top:90px;left:0;right:0;text-align:center;font-size:230px')}
    ${TRACK(`
      <div class="block" style="left:200px;background:${C.orange};font-size:44px;${anim(grow, 19.95, 0.6)}">清邁</div>
      <div class="block" style="background:${C.blue};width:500px;font-size:44px;${anim(push, 19.95, 0.6)}">里斯本</div>
      <div class="cursor" style="top:40px;${anim(cur, 19.95, 0.6)}">${icon('ArrowsHorizontal', 'bold')}</div>
    `)}
    ${A('slam big', 20.7, '鄰居<span class="hl">自己讓開。</span>', 'position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:130px')}
  `);
}

// ============ 22.0  Drag the whole stay: reorder ============
{
  const lift = kf('0% { transform: none } 15% { transform: translateY(-30px) scale(1.04); box-shadow: 0 30px 50px rgb(0 0 0 / .25) } 85% { transform: translate(450px, -30px) scale(1.04); box-shadow: 0 30px 50px rgb(0 0 0 / .25) } 100% { transform: translateX(450px) }');
  const swap = kf('from { transform: none } to { transform: translateX(-450px) }');
  const cur = kf('0% { transform: none } 15% { transform: translateY(-30px) } 85% { transform: translate(450px, -30px) } 100% { transform: translateX(450px) }');
  scene(22, 2, 'paper', `
    ${A('slam big', 22, '整塊拖 ＝ <span class="hl">換順序</span>', 'position:absolute;top:110px;left:0;right:0;text-align:center;font-size:150px')}

      ${A('up', 57.9, 'simonlin7972.github.io/digital-nomad-planner', 'font-size:42px;color:var(--muted);margin-top:40px;letter-spacing:.02em')}
    </div>
    <div class="spark a pop" style="--t:57.0;left:300px;top:220px;--c:${C.orange}"></div>
    <div class="spark a pop" style="--t:57.1;right:320px;top:260px;--c:${C.pink}"></div>
    <div class="spark a pop" style="--t:57.2;left:420px;bottom:220px;--c:${C.teal}"></div>
    <div class="spark a pop" style="--t:57.3;right:400px;bottom:250px;--c:${C.blue}"></div>
  `);
}

const style = document.createElement('style');
style.textContent = sheet;
document.head.append(style);

// ---------- playback ----------
const DURATION = 60;
const render = new URLSearchParams(location.search).has('render');
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${k})`;
}
// Puts every animation at reel time `t` (seconds) and holds it there.
window.seek = (t) => {
  for (const a of document.getAnimations()) {
    a.pause();
    a.currentTime = t * 1000;
  }
};
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.fonts].filter((f) => f.status !== 'loaded').map((f) => f.load().catch(() => {})));
  await Promise.all(['600 100px "975HazyGo"', '400 100px "975HazyGo"', '400 50px "Pixelify Sans"'].map((f) => document.fonts.load(f, '今天不在家工作 A')));
  return true;
})();
if (render) {
  document.body.classList.add('render');
  window.seek(0);
} else {
  fit();
  addEventListener('resize', fit);
  // Live preview: loop, click to restart, ?t=12 to start from 12 s
  const start = Number(new URLSearchParams(location.search).get('t') || 0);
  const restart = (t = 0) => document.getAnimations().forEach((a) => { a.currentTime = t * 1000; a.play(); });
  restart(start);
  let origin = performance.now() - start * 1000;
  setInterval(() => { if (performance.now() - origin > DURATION * 1000) { origin = performance.now(); restart(0); } }, 100);
  addEventListener('click', () => { origin = performance.now(); restart(0); });
}
</script>
</body>
