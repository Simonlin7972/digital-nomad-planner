# XcodeGen project definition. `xcodegen generate` writes NotWFH.xcodeproj (ignored by git) from this file; edit
# this, never the project. See README.md in this folder.
name: NotWFH
options:
  bundleIdPrefix: com.simonlin
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  NotWFHCore:
    path: NotWFHCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  NotWFH:
    type: application
    platform: iOS
    sources:
      - path: NotWFH
    dependencies:
      - package: NotWFHCore
      - package: Supabase
        product: Supabase
    info:
      path: NotWFH/Info.plist
      properties:
        CFBundleDisplayName: Not WFH
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Where Google's redirect lands (CloudConfig.redirect): notwfh://auth-callback
        CFBundleURLTypes:
          - CFBundleURLName: com.simonlin.notwfh.auth
            CFBundleURLSchemes: [notwfh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonlin.notwfh
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
schemes:
  NotWFH:
    build:
      targets:
        NotWFH: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: NotWFHCore/NotWFHCoreTests
